<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaporChat</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #d946ef;
            --neon-pink: #ff006e;
            --bg-black: #0a0e27;
            --bg-dark: #151932;
            --bg-glass: rgba(21, 25, 50, 0.4);
            --border-glass: rgba(0, 240, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-black) 0%, #0f1b3c 100%);
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
        }

        /* Glassmorphism Effect */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
        }

        .glass-sm {
            background: rgba(21, 25, 50, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        /* Neon Glow */
        .neon-glow {
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple);
        }

        .neon-border {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }

        /* Animations */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(217, 70, 239, 0.4);
            }
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-fade-in {
            animation: fade-in-up 0.6s ease-out forwards;
        }

        .animate-pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .animate-slide-in {
            animation: slide-in 0.4s ease-out;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 4px;
            opacity: 0.3;
        }

        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.6;
        }

        /* Chat message styling */
        .message-user {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.2), rgba(255, 0, 110, 0.1));
            border-left: 2px solid var(--neon-purple);
        }

        .message-ai {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
            border-left: 2px solid var(--neon-cyan);
        }

        .message-ai .neon-glow {
            color: var(--neon-cyan);
        }

        /* Button styles */
        .btn-neon {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-neon:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-purple {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.2);
        }

        .btn-purple:hover {
            background: rgba(217, 70, 239, 0.1);
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
        }

        /* Input styles */
        .input-neon {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .input-neon:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .input-neon::placeholder {
            color: var(--text-secondary);
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: fade-in-up 0.3s ease-out;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: relative;
            z-index: 10;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }

            .sidebar {
                max-width: 250px;
            }

            .chat-container {
                padding: 16px;
            }

            .message {
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="w-full h-screen flex">
    <!-- SIDEBAR -->
    <div class="sidebar w-64 bg-black border-r border-cyan-500 border-opacity-20 flex flex-col">
        <!-- Header -->
        <div class="p-6 border-b border-cyan-500 border-opacity-20">
            <h1 class="text-2xl font-bold neon-glow" style="font-family: 'VT323', monospace;">VAPOR</h1>
            <p class="text-xs text-cyan-400 mt-1">// CHAT PROTOCOL</p>
        </div>

        <!-- Contacts List -->
        <div class="flex-1 overflow-y-auto p-4 space-y-2">
            <button class="w-full btn-neon btn-purple justify-center mb-4">
                + New Chat
            </button>
            <div id="contactsList" class="space-y-2">
                <!-- Contacts populated by JS -->
            </div>
        </div>

        <!-- Settings & Auth -->
        <div class="border-t border-cyan-500 border-opacity-20 p-4 space-y-3">
            <button id="settingsBtn" class="w-full btn-neon text-left pl-4">
                ⚙️ Settings
            </button>
            <button id="logoutBtn" class="w-full btn-neon text-left pl-4">
                🚀 Logout
            </button>
            <div id="authStatus" class="text-xs text-cyan-400 text-center">
                <!-- Auth status -->
            </div>
        </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="flex-1 flex flex-col bg-gradient-to-br from-blue-900 from-5% via-purple-900 via-50% to-black">
        <!-- Messages Container -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center text-cyan-400 opacity-50 mt-10">
                <p class="text-sm font-mono">[ INITIALIZING VAPORCHAT ]</p>
                <p class="text-xs text-purple-400 mt-2">Select a contact to begin transmission</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t border-cyan-500 border-opacity-20 p-6 bg-black bg-opacity-50 backdrop-blur">
            <div class="flex gap-3">
                <input 
                    id="messageInput" 
                    type="text" 
                    placeholder="Enter message or /ask for AI response..." 
                    class="flex-1 input-neon"
                >
                <button id="sendBtn" class="btn-neon btn-purple px-6">
                    SEND
                </button>
            </div>
            <p class="text-xs text-cyan-400 mt-2 opacity-75">
                Tip: Start message with /ask to invoke AI (requires HF_TOKEN)
            </p>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden modal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <h2 class="text-xl font-bold neon-glow mb-4">⚙️ Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-cyan-400 mb-2">Hugging Face Token (HF_TOKEN)</label>
                    <input 
                        id="hfTokenInput" 
                        type="password" 
                        placeholder="hf_xxxxx..." 
                        class="w-full input-neon"
                    >
                    <p class="text-xs text-cyan-400 opacity-75 mt-2">
                        Token is saved to localStorage for API access
                    </p>
                </div>

                <div>
                    <label class="block text-sm text-cyan-400 mb-2">Current User Email</label>
                    <input 
                        id="userEmailDisplay" 
                        type="text" 
                        disabled 
                        class="w-full input-neon opacity-50"
                    >
                </div>

                <div class="flex gap-3 pt-4">
                    <button id="saveSettingsBtn" class="flex-1 btn-neon">
                        Save
                    </button>
                    <button id="closeSettingsBtn" class="flex-1 btn-neon btn-purple">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========================
        // GLOBAL STATE
        // ========================
        let currentUser = null;
        let selectedContact = null;
        let db = null;
        let unsubscribeMessages = null;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBOhj-irQ-UKfJ-Tp0ckbxzTXYW_-fY4KQ",
            authDomain: "vaporchat-54b50.firebaseapp.com",
            databaseURL: "https://vaporchat-54b50-default-rtdb.firebaseio.com",
            projectId: "vaporchat-54b50",
            storageBucket: "vaporchat-54b50.firebasestorage.app",
            messagingSenderId: "867648027768",
            appId: "1:867648027768:web:d4b10d221d867e3fba018d",
            measurementId: "G-RZXW7DSHT1"
        };

        // ========================
        // FIREBASE INITIALIZATION
        // ========================
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        db = firebase.firestore();

        // ========================
        // AUTH FUNCTIONS
        // ========================
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => {
                    currentUser = result.user;
                    updateAuthUI();
                })
                .catch(error => {
                    console.error("Auth error:", error);
                    alert("Login failed: " + error.message);
                });
        }

        function logout() {
            auth.signOut()
                .then(() => {
                    currentUser = null;
                    selectedContact = null;
                    updateAuthUI();
                    document.getElementById('messagesContainer').innerHTML = 
                        '<div class="text-center text-cyan-400 opacity-50 mt-10"><p class="text-sm font-mono">[ LOGGED OUT ]</p></div>';
                })
                .catch(error => console.error("Logout error:", error));
        }

        function updateAuthUI() {
            const authStatus = document.getElementById('authStatus');
            if (currentUser) {
                authStatus.textContent = currentUser.email.split('@')[0];
                document.getElementById('userEmailDisplay').value = currentUser.email;
                loadContacts();
            } else {
                authStatus.innerHTML = '<button id="loginBtn" class="text-cyan-400 hover:text-purple-400 underline">LOGIN</button>';
                document.getElementById('contactsList').innerHTML = '';
                document.getElementById('messagesContainer').innerHTML = 
                    '<div class="text-center text-cyan-400 opacity-50 mt-10"><p>Please login to start chatting</p></div>';
            }
        }

        // ========================
        // CONTACTS & MESSAGING
        // ========================
        async function loadContacts() {
            if (!currentUser) return;

            const contactsList = document.getElementById('contactsList');
            contactsList.innerHTML = '';

            // Get unique contacts from Firestore
            const querySnapshot = await db.collection('smails')
                .where('senderEmail', '==', currentUser.email)
                .get();

            const contacts = new Set();
            querySnapshot.forEach(doc => {
                contacts.add(doc.data().receiverEmail);
            });

            const querySnapshot2 = await db.collection('smails')
                .where('receiverEmail', '==', currentUser.email)
                .get();

            querySnapshot2.forEach(doc => {
                contacts.add(doc.data().senderEmail);
            });

            // Display contacts
            Array.from(contacts).forEach(email => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 glass-sm hover:neon-border transition rounded-lg text-sm hover:bg-opacity-50';
                btn.innerHTML = `<span class="text-neon-cyan">${email.split('@')[0]}</span>`;
                btn.onclick = () => selectContact(email);
                contactsList.appendChild(btn);
            });
        }

        function selectContact(email) {
            selectedContact = email;
            loadMessages();
            document.querySelectorAll('#contactsList button').forEach(btn => {
                btn.classList.remove('neon-border');
            });
            event.target.closest('button').classList.add('neon-border');
        }

        function loadMessages() {
            if (!currentUser || !selectedContact) return;

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = db.collection('smails')
                .where('senderEmail', 'in', [currentUser.email, selectedContact])
                .where('receiverEmail', 'in', [currentUser.email, selectedContact])
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    container.innerHTML = '';

                    snapshot.docs.forEach((doc, idx) => {
                        const data = doc.data();
                        const isUser = data.senderEmail === currentUser.email;
                        const messageEl = document.createElement('div');
                        messageEl.className = `message glass p-4 rounded-lg animate-slide-in ${isUser ? 'message-user ml-auto max-w-xs' : 'message-ai mr-auto max-w-xs'}`;
                        messageEl.style.animationDelay = `${idx * 0.05}s`;
                        
                        const typeLabel = data.type === 'ai' ? ' 🤖' : '';
                        messageEl.innerHTML = `
                            <p class="text-sm ${data.type === 'ai' ? 'neon-glow text-cyan-400' : 'text-white'}">${escapeHtml(data.content)}${typeLabel}</p>
                            <p class="text-xs text-gray-500 mt-2">${new Date(data.timestamp).toLocaleTimeString()}</p>
                        `;
                        container.appendChild(messageEl);
                    });

                    container.scrollTop = container.scrollHeight;
                });
        }

        // ========================
        // MESSAGE SENDING & AI
        // ========================
        async function sendMessage() {
            if (!currentUser || !selectedContact) {
                alert('Please select a contact first');
                return;
            }

            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            const isAIRequest = content.startsWith('/ask');
            const userMessage = isAIRequest ? content.substring(5).trim() : content;

            // Save user message to Firestore
            await db.collection('smails').add({
                senderEmail: currentUser.email,
                receiverEmail: selectedContact,
                content: userMessage,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'user'
            });

            input.value = '';

            // If /ask, call Hugging Face API
            if (isAIRequest) {
                await callHuggingFaceAPI(userMessage);
            }
        }

        async function callHuggingFaceAPI(prompt) {
            const hfToken = localStorage.getItem('HF_TOKEN');
            if (!hfToken) {
                alert('HF_TOKEN not set. Please configure it in Settings.');
                return;
            }

            try {
                const response = await fetch('https://router.huggingface.co/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${hfToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        model: 'deepseek-ai/DeepSeek-V4-Pro:novita',
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `API error: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;

                // Save AI response to Firestore
                await db.collection('smails').add({
                    senderEmail: 'ai-deepseek',
                    receiverEmail: currentUser.email,
                    content: aiResponse,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    type: 'ai'
                });
            } catch (error) {
                console.error('Hugging Face API error:', error);
                alert('AI request failed: ' + error.message);
            }
        }

        // ========================
        // SETTINGS MODAL
        // ========================
        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('hfTokenInput').value = localStorage.getItem('HF_TOKEN') || '';
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const token = document.getElementById('hfTokenInput').value;
            if (token) {
                localStorage.setItem('HF_TOKEN', token);
                alert('Settings saved!');
            }
            closeSettings();
        }

        // ========================
        // UTILITIES
        // ========================
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ========================
        // EVENT LISTENERS
        // ========================
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('modalOverlay').addEventListener('click', closeSettings);

        // Auth state listener
        auth.onAuthStateChanged(user => {
            currentUser = user;
            updateAuthUI();
        });

        // Initial auth UI
        document.addEventListener('DOMContentLoaded', () => {
            // Handle login button if not authenticated
            document.addEventListener('click', e => {
                if (e.target.id === 'loginBtn') {
                    loginWithGoogle();
                }
            });
        });
    </script>
</body>
</html>
